spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://tu-host-remoto:3306/db_cine_sucursales
    username: root
    password: tu-password-seguro
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none 
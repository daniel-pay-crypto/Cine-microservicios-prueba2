server:
  port: 8085

spring:
  application:
    name: ms-sucursales
  profiles:
    active: dev
---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/db_cine_sucursales?createDatabaseIfNotExist=true
    username: root
    password: 
  jpa:
    show-sql: true

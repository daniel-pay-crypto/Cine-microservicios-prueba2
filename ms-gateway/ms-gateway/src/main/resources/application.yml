server
port: 8080
spring:
    application:
        name: ms-gateway
    cloud:
        gateway:
            routes:
                - id: ms-cliente-route
                #aca defino la direccion a la que Gateway enviara la peticion, en este caso a ms-clientes, que es el nombre del servicio registrado en Eureka
                  uri: lb://ms-cliente
                  predicates:
                    - Path=/api/v1/clientes/**
                    
                - id: ms-tickets-route
                    #Direccion de mi ms-tickets.
                  uri: lb://ms-tickets
                  predicates:
                    - Path=/api/v1/tickets/**

                - id: ms-peliculas-route
                  uri: lb://ms-peliculas
                  predicates:
                    - Path=/api/v1/peliculas/**